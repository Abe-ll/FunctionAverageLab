name: Verificar y construir

on:
  push:
    branches: [main, "mejoras/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pruebas en Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Pruebas con pantalla virtual en Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CalculoPromedio-Windows
          path: dist/CalculoPromedio-Windows.zip
          if-no-files-found: error
          retention-days: 30
